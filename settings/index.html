<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Settings v3.0.4-beta</title>
  <meta name="theme-color" content="#0a0a0f" />
  <script src="../js/console-capture.js" data-n3xn="safe"></script>
  <script src="../js/anti-blocksi.js" data-n3xn="safe"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/v3-ui.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* page chrome fixed; inner scrolls */
      background: var(--bg, #0b0b14);
      color: var(--text, #e8e8f0);
      font-family: system-ui, sans-serif;
    }
    .settings-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100dvh;
    }
    .settings-top {
      flex: 0 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border, #22223a);
      background: color-mix(in srgb, var(--bg2, #10101a) 90%, transparent);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 5;
    }
    .settings-top a { color: var(--accent, #8b9cff); text-decoration: none; }
    .settings-scroll {
      flex: 1 1 auto;
      min-height: 0; /* CRITICAL for flex child scroll */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 0 0 48px;
      scroll-behavior: smooth;
    }
    #settings-root { max-width: 980px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
    .settings-section {
      margin: 1.25rem 0;
      padding: 1rem 1.15rem;
      border: 1px solid color-mix(in srgb, var(--border, #22223a) 80%, var(--accent, #8b9cff));
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel, #151522) 92%, transparent);
      box-shadow: 0 8px 28px rgba(0,0,0,.28);
    }
    .settings-section h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      letter-spacing: .02em;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
    .form-group label, .check-row { font-size: 12px; opacity: .9; }
    .form-group input, .form-group select {
      background: var(--bg, #0b0b14);
      color: var(--text);
      border: 1px solid var(--border, #22223a);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent, #8b9cff);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #8b9cff) 28%, transparent);
    }
    .check-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 8px;
      max-height: none;
    }
    .theme-swatch {
      text-align: left;
      border-radius: 10px;
      border: 1px solid var(--border, #22223a);
      padding: 10px 10px 12px;
      cursor: pointer;
      color: inherit;
      background: var(--bg2, #10101a);
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .theme-swatch:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent, #8b9cff) 30%, transparent);
    }
    .theme-swatch .swatch-bar {
      height: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent, #8b9cff), var(--ok, #6bffb8));
    }
    .theme-swatch.active {
      border-color: var(--accent, #8b9cff);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #8b9cff) 40%, transparent);
    }
    .btn {
      display: inline-block;
      margin: 4px 6px 4px 0;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border, #22223a);
      background: var(--bg2, #10101a);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    .btn.primary {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent, #8b9cff) 90%, #fff), color-mix(in srgb, var(--accent, #8b9cff) 45%, #c07cff));
      color: #0a0a12;
      border: 0;
      font-weight: 600;
    }
    .muted { opacity: .75; font-size: 13px; }
    .nav-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-pills a {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border, #22223a);
      color: inherit;
      text-decoration: none;
    }
    .nav-pills a:hover { border-color: var(--accent, #8b9cff); }
    .preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  </style>
</head>
<body data-n3xn="safe">
  <div class="settings-shell">
    <header class="settings-top">
      <strong>Settings <small class="n3xn-version">v3.0.4-beta</small></strong>
      <nav class="nav-pills">
        <a href="#sec-theme">Themes</a>
        <a href="#sec-engine">Engine</a>
        <a href="#sec-monaco">Monaco</a>
        <a href="#sec-cm">CodeMirror</a>
        <a href="#sec-compress">Compress</a>
        <a href="#sec-mc">Minecraft</a>
      </nav>
      <span style="flex:1"></span>
      <a href="/connectors/">Connectors</a>
      <a href="/explorer/">Explorer</a>
      <a href="/">VFS</a>
    </header>
    <div class="settings-scroll">
      <div id="settings-root"></div>
    </div>
  </div>
  <script type="module">
    import { renderSettingsUI, registerMonacoThemesFromCatalog } from "../js/settings-app.js";
    import { loadSavedAppTheme } from "../js/themes-catalog.js";
    import { applyVersionToDom } from "../js/version.js";
    loadSavedAppTheme();
    applyVersionToDom();
    renderSettingsUI(document.getElementById("settings-root"));
    try { registerMonacoThemesFromCatalog(); } catch (_) {}
  </script>
</body>
</html>
