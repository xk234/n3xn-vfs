<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Explorer</title>
  <meta name="theme-color" content="#050508" />
  <script src="../js/console-capture.js" data-n3xn="safe"></script>
  <script src="../js/anti-blocksi.js" data-n3xn="safe"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/v3-ui.css" />
  <link rel="stylesheet" href="../css/explorer.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body data-n3xn="safe">
  <div class="exp-shell">
    <header class="exp-top">
      <span class="brand">n3xn <span class="n3xn-version">Explorer</span></span>
      <span class="muted">VS Code–style tree · Ctrl+S save</span>
      <span style="flex:1"></span>
      <a href="/settings/">Settings</a>
      <a href="/cloaker/">Cloaker</a>
      <a href="/mc/">Minecraft</a>
      <a href="/">VFS</a>
    </header>
    <div id="explorer-root"></div>
  </div>
  <script type="module">
    const root = document.getElementById("explorer-root");
    function fail(e) {
      console.error("[explorer]", e);
      root.innerHTML =
        "<div style='padding:1.5rem'><h2>Explorer failed</h2><pre style='white-space:pre-wrap;color:#ff8'>" +
        String(e && (e.stack || e.message || e)).replace(/</g, "<") +
        "</pre><p><a href='/'>Back to VFS</a></p></div>";
    }
    try {
      await import("../js/ui-modal.js");
      await import("../js/fs-bridge.js").then((m) => m.ensureFsBridge());
      const mod = await import("../js/explorer-app.js");
      try {
        const { applyVersionToDom } = await import("../js/version.js");
        applyVersionToDom();
      } catch (_) {}
      if (mod.mountExplorer) await mod.mountExplorer(root);
      else fail(new Error("explorer-app missing mountExplorer"));
    } catch (e) {
      fail(e);
    }
  </script>
</body>
</html>
