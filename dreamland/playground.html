<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Dreamland Studio</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #09090b; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 44px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 10px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: #38bdf8; }
    .badge { background: #1e293b; color: #7dd3fc; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chk-label { font-size: 12px; color: #a1a1aa; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    button { background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:hover { background: #3f3f46; }
    button.primary { background: #38bdf8; color: #09090b; border-color: #38bdf8; }
    button.primary:hover { background: #7dd3fc; }
    .btn-sm { padding: 2px 6px; }
    a.nav { color: #a1a1aa; text-decoration: none; font-size: 12px; margin-left: 8px; }
    a.nav:hover { color: #fff; }
    .workspace { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .sidebar { width: 220px; background: #121215; border-right: 1px solid #27272a; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-head { padding: 10px 12px; font-size: 11px; font-weight: 700; color: #a1a1aa; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
    .file-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .file-item { padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; color: #a1a1aa; }
    .file-item:hover { background: #1f1f23; color: #fff; }
    .file-item.active { background: #1e293b; color: #38bdf8; box-shadow: inset 2px 0 0 #38bdf8; }
    .file-del { opacity: 0; color: #f87171; font-weight: bold; padding: 0 4px; }
    .file-item:hover .file-del { opacity: 1; }
    .editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #27272a; }
    #monaco-root { flex: 1; width: 100%; height: 100%; }
    .preview-pane { flex: 1; display: flex; flex-direction: column; background: #020617; min-width: 0; }
    iframe#preview { flex: 1; width: 100%; border: none; background: #090d16; }
    .console-bar { height: 170px; background: #09090c; border-top: 1px solid #27272a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 6px 10px; overflow-y: auto; color: #d4d4d8; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .log-entry { padding: 3px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.02); border-left: 2px solid #3f3f46; }
    .log-err { color: #fca5a5; background: rgba(239, 68, 68, 0.12); border-left-color: #ef4444; }
    .log-warn { color: #fde047; background: rgba(234, 179, 8, 0.1); border-left-color: #eab308; }
    .log-ok { color: #86efac; border-left-color: #22c55e; }
    .log-stack { margin-top: 4px; padding-left: 12px; font-size: 11px; color: #f87171; white-space: pre-wrap; opacity: 0.9; }
  </style>
  <link rel="stylesheet" href="./playground.css" />
</head>
<body data-n3xn="safe">
  <header class="topbar">
    <div class="brand">
      <span>⚡ n3xn Dreamland Studio</span>
      <span class="badge" id="status-badge">Booting SW…</span>
      <a class="nav" href="../">VFS</a>
      <a class="nav" href="../explorer/">Explorer</a>
    </div>
    <div class="actions">
      <label class="chk-label">
        <input type="checkbox" id="autorun-chk" checked /> Auto-Run
      </label>
      <button type="button" id="warm-btn">Warm Offline Cache</button>
      <button type="button" id="reset-btn">Reset Demo</button>
      <button type="button" id="export-btn">Export .HTML</button>
      <button type="button" class="primary" id="run-btn">▶ Run (Ctrl+S)</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>PROJECT FILES</span>
        <button type="button" id="new-file-btn" class="btn-sm">+ File</button>
      </div>
      <div class="file-list" id="file-list"></div>
    </aside>

    <section class="editor-pane">
      <div id="monaco-root"></div>
    </section>

    <section class="preview-pane">
      <iframe
        id="preview"
        title="Dreamland Preview"
        allow="autoplay; fullscreen; gamepad"
        sandbox="allow-scripts allow-modals allow-pointer-lock allow-forms"
      ></iframe>
      <div class="console-bar" id="console-out"></div>
    </section>
  </main>

  <script type="module" src="./js/playground.js"></script>
</body>
</html>
