<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Connectors v3.0.4-beta</title>
  <meta name="theme-color" content="#0a0a0f" />
  <script src="../js/console-capture.js" data-n3xn="safe"></script>
  <script src="../js/anti-blocksi.js" data-n3xn="safe"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/v3-ui.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg, #0b0b14);
      color: var(--text, #e8e8f0);
      font-family: system-ui, sans-serif;
    }
    .conn-shell { display: flex; flex-direction: column; height: 100%; max-height: 100dvh; }
    .conn-top {
      flex: 0 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border, #22223a);
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      background: color-mix(in srgb, var(--bg2, #10101a) 90%, transparent);
    }
    .conn-top a { color: var(--accent, #8b9cff); text-decoration: none; }
    .conn-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-bottom: 48px;
    }
    #connectors-root { max-width: 760px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
    .conn-card {
      margin: 1rem 0;
      padding: 1rem 1.15rem;
      border: 1px solid color-mix(in srgb, var(--border, #22223a) 80%, var(--accent, #8b9cff));
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel, #151522) 92%, transparent);
      box-shadow: 0 8px 28px rgba(0,0,0,.28);
    }
    .conn-card h3 { margin: 0 0 8px; font-size: 1rem; }
    .form-group { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
    .form-group input {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border, #22223a); padding: 8px 10px; border-radius: 8px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #8b9cff);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #8b9cff) 28%, transparent);
    }
    .btn {
      margin-right: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border, #22223a); background: var(--bg2, #10101a);
      color: var(--text); cursor: pointer; font: inherit;
    }
    .btn.primary {
      background: linear-gradient(135deg, #7c8cff, #b07cff); color: #0a0a12; border: 0; font-weight: 600;
    }
    .muted { opacity: .75; font-size: 13px; }
  </style>
</head>
<body data-n3xn="safe">
  <div class="conn-shell">
    <header class="conn-top">
      <strong>Connectors <small class="n3xn-version">v3.0.4-beta</small></strong>
      <span style="flex:1"></span>
      <a href="/settings/">Settings</a>
      <a href="/">VFS</a>
    </header>
    <div class="conn-scroll">
      <div id="connectors-root"></div>
    </div>
  </div>
  <script type="module">
    import { renderConnectorsUI } from "../js/connectors-app.js";
    import { loadSavedAppTheme } from "../js/themes-catalog.js";
    import { applyVersionToDom } from "../js/version.js";
    loadSavedAppTheme();
    applyVersionToDom();
    renderConnectorsUI(document.getElementById("connectors-root"));
  </script>
</body>
</html>
