<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Dreamland Studio</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #09090b; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 44px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: #38bdf8; }
    .badge { background: #1e293b; color: #7dd3fc; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button { background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:hover { background: #3f3f46; }
    button.primary { background: #38bdf8; color: #09090b; border-color: #38bdf8; }
    a.nav { color: #a1a1aa; text-decoration: none; font-size: 12px; margin-left: 8px; }
    a.nav:hover { color: #fff; }
    .workspace { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 220px; background: #121215; border-right: 1px solid #27272a; display: flex; flex-direction: column; }
    .sidebar-head { padding: 10px 12px; font-size: 11px; font-weight: 700; color: #a1a1aa; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
    .file-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .file-item { padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; color: #a1a1aa; }
    .file-item:hover { background: #1f1f23; color: #fff; }
    .file-item.active { background: #1e293b; color: #38bdf8; box-shadow: inset 2px 0 0 #38bdf8; }
    .file-del { opacity: 0; color: #f87171; font-weight: bold; padding: 0 4px; }
    .file-item:hover .file-del { opacity: 1; }
    .editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #27272a; }
    #monaco-root { flex: 1; width: 100%; }
    .preview-pane { flex: 1; display: flex; flex-direction: column; background: #020617; min-width: 0; }
    iframe { flex: 1; width: 100%; border: none; background: #090d16; }
    .console-bar { height: 115px; background: #0c0c0f; border-top: 1px solid #27272a; font-family: ui-monospace, monospace; font-size: 12px; padding: 8px 12px; overflow-y: auto; color: #a1a1aa; }
    .log-err { color: #f87171; }
    .log-ok { color: #4ade80; }
  </style>
</head>
<body data-n3xn="safe">
  <div class="topbar">
    <div class="brand">
      <span>⚡ n3xn Dreamland Studio</span>
      <span class="badge" id="status-badge">Booting…</span>
      <a class="nav" href="../">VFS</a>
      <a class="nav" href="../explorer/">Explorer</a>
    </div>
    <div class="actions">
      <label style="font-size:12px;color:#a1a1aa;display:flex;align-items:center;gap:4px;cursor:pointer;">
        <input type="checkbox" id="autorun-chk" checked /> Auto-Run
      </label>
      <button type="button" id="warm-btn">Offline Cache</button>
      <button type="button" id="reset-btn">Reset Demo</button>
      <button type="button" id="export-btn">Export .HTML</button>
      <button type="button" class="primary" id="run-btn">▶ Run (Ctrl+S)</button>
    </div>
  </div>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head"><span>PROJECT FILES</span>
        <button type="button" id="new-file-btn" style="padding:2px 6px;">+ File</button>
      </div>
      <div class="file-list" id="file-list"></div>
    </aside>
    <section class="editor-pane"><div id="monaco-root"></div></section>
    <section class="preview-pane">
      <iframe id="preview" title="preview" allow="autoplay; fullscreen; gamepad" sandbox="allow-scripts allow-modals allow-pointer-lock allow-forms"></iframe>
      <div class="console-bar" id="console-out"></div>
    </section>
  </div>

  <script type="module">
    const JSDELIVR_LIVE = "https://cdn.jsdelivr.net/";
    const MONACO_BASE = JSDELIVR_LIVE + "npm/monaco-editor@0.52.0/min/vs";
    const STORAGE_KEY = "n3xn_dreamland_vfs_v4";

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((reg) => reg.update()).catch(() => {});
    }

    const statusBadge = document.getElementById("status-badge");
    const consoleOut = document.getElementById("console-out");
    const previewFrame = document.getElementById("preview");
    const fileListEl = document.getElementById("file-list");

    function log(msg, cls = "") {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
      consoleOut.appendChild(line);
      consoleOut.scrollTop = consoleOut.scrollHeight;
    }

    // 1. Load esbuild-wasm (intercepted & cached offline by sw.js)
    const esbuild = await import(JSDELIVR_LIVE + "npm/esbuild-wasm@0.24.2/esm/browser.min.js");
    await esbuild.initialize({
      wasmURL: JSDELIVR_LIVE + "npm/esbuild-wasm@0.24.2/esbuild.wasm",
      worker: false,
    });

    // 2. Load Monaco loader.js (intercepted & cached offline by sw.js, never hits CF SPA HTML)
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = MONACO_BASE + "/loader.js";
      s.onload = res;
      s.onerror = rej;
      document.head.appendChild(s);
    });

    const DEFAULT_FILES = {
      "/src/main.tsx": `import { css, type Component } from "dreamland/core";
import { HUD } from "./HUD.tsx";

export const App: Component<{}, { score: number; timeLeft: number; active: boolean; x: number; y: number }> = function () {
  this.score = 0; this.timeLeft = 15; this.active = false; this.x = 50; this.y = 50;
  let timer: number | undefined;
  const move = () => { this.x = 12 + Math.floor(Math.random() * 76); this.y = 15 + Math.floor(Math.random() * 70); };
  const start = () => {
    clearInterval(timer); this.score = 0; this.timeLeft = 15; this.active = true; move();
    timer = window.setInterval(() => { this.timeLeft--; if (this.timeLeft <= 0) { clearInterval(timer); this.active = false; } }, 1000);
  };
  return (
    <div class="card">
      <HUD score={use(this.score)} timeLeft={use(this.timeLeft)} />
      <div class="arena">
        {use(this.active).map((on) => on ? (
          <button class="orb" style={use\`left: \${this.x}%; top: \${this.y}%;\`} on:click={() => { this.score++; move(); }}>+1</button>
        ) : (
          <div class="center">
            <p>{this.score > 0 ? \`Final: \${this.score}\` : "Dreamland Studio"}</p>
            <button class="btn" on:click={start}>{this.score > 0 ? "Again" : "Start"}</button>
          </div>
        ))}
      </div>
    </div>
  );
};
App.style = css\`:scope{max-width:460px;margin:2rem auto;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:1.25rem}.arena{position:relative;height:260px;background:#020617;border-radius:8px;margin-top:1rem}.orb{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:none;background:#38bdf8;font-weight:800;cursor:pointer}.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}.btn{background:#38bdf8;color:#090d16;border:none;padding:.6rem 1.2rem;border-radius:8px;font-weight:700;cursor:pointer}\`;
export default App;
`,
      "/src/HUD.tsx": `import { css, type Component } from "dreamland/core";
export const HUD: Component<{ score: number; timeLeft: number }> = function (cx) {
  return (<header><h3>⚡ Dreamland Reflex</h3><div class="meta"><span>Score: <strong>{use(cx.score)}</strong></span><span>Time: <strong>{use(cx.timeLeft)}s</strong></span></div></header>);
};
HUD.style = css\`:scope{display:flex;justify-content:space-between;align-items:center}.meta{display:flex;gap:1rem;color:#94a3b8}strong{color:#38bdf8}\`;
`,
    };

    const savedRaw = localStorage.getItem(STORAGE_KEY);
    let files = savedRaw ? JSON.parse(savedRaw) : structuredClone(DEFAULT_FILES);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(files));

    let activeFile = files["/src/main.tsx"] ? "/src/main.tsx" : Object.keys(files)[0];
    let editor = null;
    let lastBuiltHtml = "";
    let debounceTimer = null;

    function saveVFS() { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); }
    function renderSidebar() {
      fileListEl.innerHTML = "";
      for (const path of Object.keys(files).sort()) {
        const row = document.createElement("div");
        row.className = "file-item" + (path === activeFile ? " active" : "");
        const label = document.createElement("span"); label.textContent = path; row.appendChild(label);
        if (path !== "/src/main.tsx") {
          const del = document.createElement("span"); del.className = "file-del"; del.textContent = "×";
          del.onclick = (e) => {
            e.stopPropagation();
            delete files[path];
            monaco.editor.getModel(monaco.Uri.parse("file://" + path))?.dispose();
            saveVFS();
            if (activeFile === path) switchFile("/src/main.tsx"); else renderSidebar();
            buildAndRun();
          };
          row.appendChild(del);
        }
        row.onclick = () => switchFile(path);
        fileListEl.appendChild(row);
      }
    }

    function getOrCreateModel(path, content) {
      const uri = monaco.Uri.parse("file://" + path);
      let model = monaco.editor.getModel(uri);
      const lang = path.endsWith(".tsx") || path.endsWith(".ts") ? "typescript" : path.endsWith(".css") ? "css" : "javascript";
      if (!model) model = monaco.editor.createModel(content, lang, uri);
      else if (model.getValue() !== content) model.setValue(content);
      return model;
    }

    function switchFile(path) {
      activeFile = path;
      editor.setModel(getOrCreateModel(path, files[path]));
      renderSidebar();
    }

    await new Promise((resolve, reject) => {
      // Blob worker loading directly from jsDelivr (cached by sw.js, never hits CF SPA HTML)
      window.MonacoEnvironment = {
        getWorker: function () {
          const workerCode = `
            self.MonacoEnvironment = { baseUrl: "${MONACO_BASE}/" };
            importScripts("${MONACO_BASE}/base/worker/workerMain.js");
          `;
          return new Worker(URL.createObjectURL(new Blob([workerCode], { type: "application/javascript" })));
        },
      };
      window.require.config({ paths: { vs: MONACO_BASE } });
      window.require(["vs/editor/editor.main"], () => {
        monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
          target: monaco.languages.typescript.ScriptTarget.ES2022,
          module: monaco.languages.typescript.ModuleKind.ESNext,
          jsx: monaco.languages.typescript.JsxEmit.Preserve,
          jsxImportSource: "dreamland",
          allowNonTsExtensions: true,
        });
        monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
          noSemanticValidation: true,
          noSyntaxValidation: false,
        });
        for (const [p, code] of Object.entries(files)) getOrCreateModel(p, code);
        editor = monaco.editor.create(document.getElementById("monaco-root"), {
          model: getOrCreateModel(activeFile, files[activeFile]),
          theme: "vs-dark", automaticLayout: true, fontSize: 13, minimap: { enabled: false },
        });
        editor.onDidChangeModelContent(() => {
          files[activeFile] = editor.getValue(); saveVFS();
          if (document.getElementById("autorun-chk").checked) {
            clearTimeout(debounceTimer); debounceTimer = setTimeout(buildAndRun, 350);
          }
        });
        window.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); buildAndRun(); }
        });
        resolve();
      }, reject);
    });

    // Fetch & bundle esm.sh packages INLINE so the srcdoc iframe makes ZERO external requests!
    const pkgMemCache = new Map();
    async function fetchPackageSource(url) {
      if (pkgMemCache.has(url)) return pkgMemCache.get(url);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      const text = await res.text();
      if (ct.includes("text/html") || text.trimStart().startsWith("<!")) {
        throw new Error(`Received HTML instead of JS for ${url}`);
      }
      pkgMemCache.set(url, { text, finalUrl: res.url || url });
      return pkgMemCache.get(url);
    }

    function resolvePath(importer, rel) {
      const cleanImporter = String(importer || "/src/main.tsx").replace(/^vfs:/, "").replace(/^file:\/\//, "");
      if (rel.startsWith("/")) return rel;
      const segs = cleanImporter.split("/").filter(Boolean);
      segs.pop();
      for (const seg of rel.split("/")) {
        if (!seg || seg === ".") continue;
        if (seg === "..") segs.pop();
        else segs.push(seg);
      }
      return "/" + segs.join("/");
    }

    function findFile(base) {
      for (const ext of ["", ".tsx", ".ts", ".jsx", ".js"]) {
        if (files[base + ext] !== undefined) return base + ext;
      }
      return null;
    }

    async function buildAndRun() {
      const t0 = performance.now();
      consoleOut.innerHTML = "";
      const cssChunks = [];

      const vfsPlugin = {
        name: "n3xn-vfs",
        setup(build) {
          build.onResolve({ filter: /^https?:\/\// }, (args) => ({
            path: args.path,
            namespace: "http-pkg",
          }));
          build.onResolve({ filter: /^\//, namespace: "http-pkg" }, (args) => ({
            path: new URL(args.path, args.importer).href,
            namespace: "http-pkg",
          }));
          build.onResolve({ filter: /^\./, namespace: "http-pkg" }, (args) => ({
            path: new URL(args.path, args.importer).href,
            namespace: "http-pkg",
          }));
          build.onResolve({ filter: /^[^./]/ }, (args) => ({
            path: "https://esm.sh/" + args.path,
            namespace: "http-pkg",
          }));
          build.onLoad({ filter: /.*/, namespace: "http-pkg" }, async (args) => {
            try {
              const { text } = await fetchPackageSource(args.path);
              return { contents: text, loader: "js" };
            } catch (e) {
              return { errors: [{ text: String(e.message || e) }] };
            }
          });
          build.onResolve({ filter: /^(\.|\/)/ }, (args) => {
            const importer = String(args.importer || "/src/main.tsx").replace(/^vfs:/, "");
            const base = resolvePath(importer, args.path);
            const found = findFile(base);
            if (found) return { path: found, namespace: "vfs" };
            return { errors: [{ text: "Not found: " + args.path + " (resolved " + base + ")" }] };
          });
          build.onLoad({ filter: /.*/, namespace: "vfs" }, (args) => {
            const src = files[args.path] ?? "";
            if (args.path.endsWith(".css")) { cssChunks.push(src); return { contents: "", loader: "js" }; }
            const loader = args.path.endsWith(".tsx") ? "tsx" : args.path.endsWith(".ts") ? "ts" : "jsx";
            return { contents: src, loader };
          });
        },
      };

      try {
        const virtualEntry = `
          import * as Entry from "/src/main.tsx";
          import { h } from "dreamland/core";
          const root = document.getElementById("app");
          if (root && root.childNodes.length === 0) {
            const C = Entry.default || Entry.App;
            if (typeof C === "function") root.appendChild(h(C, {}));
          }
        `;
        const out = await esbuild.build({
          stdin: { contents: virtualEntry, resolveDir: "/", loader: "tsx" },
          bundle: true, write: false, format: "esm", target: "es2022",
          jsx: "transform", jsxFactory: "h", jsxFragment: "Fragment", plugins: [vfsPlugin],
        });
        const js = out.outputFiles[0].text;
        const bridge = `<script>window.addEventListener("error",e=>parent.postMessage({type:"err",msg:e.message},"*"));["log","warn","error"].forEach(m=>{const o=console[m];console[m]=(...a)=>{o(...a);parent.postMessage({type:m==="error"?"err":"log",msg:a.join(" ")},"*")}});<\/script>`;
        lastBuiltHtml = "<!doctype html><html><head><meta charset=UTF-8><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#090d16;color:#f8fafc;font-family:system-ui}" +
          cssChunks.join("\n") + "</style>" + bridge + "</head><body><div id=app></div><script type=module>" + js + "</" + "script></body></html>";
        previewFrame.srcdoc = lastBuiltHtml;
        const ms = Math.round(performance.now() - t0);
        statusBadge.textContent = (navigator.onLine ? "Online" : "Offline") + " · " + ms + "ms";
        log("Compiled & bundled in " + ms + "ms", "log-ok");
      } catch (err) {
        statusBadge.textContent = "Build Error";
        (err?.errors ? err.errors.map((e) => e.text) : [String(err)]).forEach((m) => log(m, "log-err"));
      }
    }

    window.addEventListener("message", (e) => {
      if (e.data?.type === "err") log(e.data.msg, "log-err");
      if (e.data?.type === "log") log(e.data.msg);
    });

    document.getElementById("run-btn").onclick = buildAndRun;
    document.getElementById("warm-btn").onclick = async () => {
      statusBadge.textContent = "Warming…";
      const reg = await navigator.serviceWorker?.ready;
      reg?.active?.postMessage({ type: "WARM_DREAMLAND" });
      log("WARM_DREAMLAND sent to dreamland/sw.js", "log-ok");
    };
    document.getElementById("new-file-btn").onclick = () => {
      const name = prompt("New file path:", "/src/Component.tsx");
      if (!name) return;
      const clean = name.startsWith("/") ? name : "/" + name;
      if (!files[clean]) {
        files[clean] = 'import { type Component } from "dreamland/core";\nexport const NewComp: Component = function () { return <div>' + clean + '</div>; };\n';
        saveVFS();
      }
      switchFile(clean);
    };
    document.getElementById("reset-btn").onclick = () => {
      files = structuredClone(DEFAULT_FILES); saveVFS();
      Object.entries(files).forEach(([p, c]) => getOrCreateModel(p, c));
      switchFile("/src/main.tsx"); buildAndRun();
    };
    document.getElementById("export-btn").onclick = () => {
      if (!lastBuiltHtml) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lastBuiltHtml], { type: "text/html" }));
      a.download = "dreamland-app.html"; a.click();
    };

    renderSidebar();
    statusBadge.textContent = "Ready";
    buildAndRun();
  </script>
</body>
</html>
